<!DOCTYPE html>

<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231C2A20'/><text y='.85em' font-size='72' text-anchor='middle' x='50'>&#x2618;</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1C2A20;

    .clover { font-size: 56px; color: #8FA98A; display: block; margin-bottom: 24px; }
    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    h1 em { font-style: italic; color: #C9B98F; }
    p { font-size: 17px; font-weight: 300; line-height: 1.6; opacity: 0.85; margin-bottom: 32px; }
    a.btn {
      display: inline-block;
      padding: 15px 34px;
      border: 1px solid #F5F0E6;
      border-radius: 999px;
      color: #F5F0E6;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 0.02em;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    a.btn:hover { background-color: #F5F0E6; color: #1C2A20; }
  </style>
</head>

  <div class="box">

  </div>

</html>
